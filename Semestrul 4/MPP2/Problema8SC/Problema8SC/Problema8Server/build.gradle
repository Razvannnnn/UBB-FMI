plugins {
    id 'java'
    id 'application'
}

group = 'problema8.server'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation project (':Problema8Model')
    implementation project (':Problema8Services')
    implementation project (':Problema8Persistence')
    implementation project (':Problema8Networking')

    implementation 'org.apache.logging.log4j:log4j-core:2.24.3'
    implementation 'org.apache.logging.log4j:log4j-api:2.24.3'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application{
    mainClass='StartJsonServer'
}

test {
    useJUnitPlatform()
}